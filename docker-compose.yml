services:
  app:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
    depends_on:
      - postgres
      - redis
      - evolution-api

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    restart: always
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - REDIS_URI=redis://redis:6379
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-evolution}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

volumes:
  postgres_data_v2:
  redis_data:
